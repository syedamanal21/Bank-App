<!DOCTYPE html>

<html>
<head>
  <title>Heera's Bank App</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #5e95ec, #2647a4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    #app {
      width: 450px;
      background: #ffffff;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    #app-title {
      color: #1e3a8a;
      margin-bottom: 8px;
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .bank-icon {
      width: 40px;
      height: 40px;
      background: #1e3a8a;
      color: white;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 5px 12px rgba(30, 58, 138, 0.25);
    }

    #welcome {
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 22px;
    }

    #account-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    #account-name {
      color: #1e293b;
      font-weight: bold;
    }

    #account-type {
      color: #64748b;
      font-size: 12px;
      margin-top: 3px;
    }

    #security {
      color: #16a34a;
      font-size: 12px;
      font-weight: bold;
    }

    #balance-box {
      background: linear-gradient(135deg, #2647a4, #1e3a8a);
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    #balance-label {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    #balance {
      font-size: 36px;
      font-weight: bold;
    }

    #currency {
      font-size: 16px;
      margin-left: 5px;
      opacity: 0.9;
    }

    #stats-box {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat-card {
      width: 50%;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
    }

    .stat-title {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
    }

    #entry-box {
      margin-bottom: 20px;
    }

    #amount-label {
      display: block;
      margin-bottom: 8px;
      color: #1e293b;
      font-weight: bold;
      font-size: 14px;
    }

    #amount {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    #amount:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #button-box {
      display: flex;
      gap: 12px;
    }

    .action {
      width: 50%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .credit {
      background: #16a34a;
    }

    .debit {
      background: #dc2626;
    }

    .action:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .action:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
      min-height: 20px;
      font-size: 14px;
      text-align: center;
    }

    #history-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      margin-bottom: 12px;
    }

    #history-title h3 {
      color: #1e293b;
      font-size: 17px;
    }

    #clear-btn {
      border: none;
      background: transparent;
      color: #dc2626;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    #transactions {
      max-height: 180px;
      overflow-y: auto;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .transaction-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .transaction-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .credit-icon {
      background: #16a34a;
    }

    .debit-icon {
      background: #dc2626;
    }

    .transaction-name {
      font-size: 13px;
      font-weight: bold;
      color: #1e293b;
    }

    .transaction-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .transaction-amount {
      font-size: 13px;
      font-weight: bold;
    }

    .credit-text {
      color: #16a34a;
    }

    .debit-text {
      color: #dc2626;
    }

    #empty-message {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      padding: 15px;
    }

    #note {
      margin-top: 22px;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
      padding-top: 15px;
      text-align: center;
    }

    @media (max-width: 500px) {

      #app {
        width: 100%;
        padding: 22px;
      }

      #app-title {
        font-size: 27px;
      }

      #balance {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

  <div id="app">

<h1 id="app-title">
  <span class="bank-icon">▣</span>
  NEXA BANK
</h1>

<p id="welcome">Secure • Simple • Smart Banking</p>


<div id="account-box">

  <div>
    <p id="account-name">Welcome,Manal!</p>
    <p id="account-type">Personal Account</p>
  </div>

  <p id="security">🔒 Secure</p>

</div>


<div id="balance-box">

  <p id="balance-label">Available Balance</p>

  <p id="balance">
    1000
    <span id="currency">PKR</span>
  </p>

</div>


<div id="stats-box">

  <div class="stat-card">
    <p class="stat-title">Account Status</p>
    <p class="stat-value">Active</p>
  </div>

  <div class="stat-card">
    <p class="stat-title">Last Action</p>
    <p class="stat-value" id="last-action">None</p>
  </div>

</div>


<div id="entry-box">

  <label id="amount-label" for="amount">
    Enter Amount
  </label>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount"
  >

</div>


<div id="button-box">

  <button class="action credit" id="credit-btn">
    Credit
  </button>

  <button class="action debit" id="debit-btn">
    Debit
  </button>

</div>


<p id="message"></p>


<div id="history-title">

  <h3>Recent Transactions</h3>

  <button id="clear-btn">
    Clear History
  </button>

</div>


<div id="transactions">

  <p id="empty-message">
    No transactions yet.
  </p>

</div>


<p id="note">
  🔒 Your banking information is secure.
  Terms and conditions apply.
</p>


  </div>

  <script>

    let balance = 1000;

    const balanceDisplay =
      document.getElementById("balance");

    const amountInput =
      document.getElementById("amount");

    const message =
      document.getElementById("message");

    const creditButton =
      document.getElementById("credit-btn");

    const debitButton =
      document.getElementById("debit-btn");

    const transactions =
      document.getElementById("transactions");

    const clearButton =
      document.getElementById("clear-btn");

    const lastAction =
      document.getElementById("last-action");


    function updateBalance() {

      balanceDisplay.innerHTML =
        balance.toLocaleString() +
        ' <span id="currency">PKR</span>';

    }


    function addTransaction(type, amount) {

      const emptyMessage =
        document.getElementById("empty-message");

      if (emptyMessage) {
        emptyMessage.remove();
      }

      const transaction =
        document.createElement("div");

      transaction.className = "transaction";

      const currentTime =
        new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });


      if (type === "Credit") {

        transaction.innerHTML = `

          <div class="transaction-left">

            <div class="transaction-icon credit-icon">
              +
            </div>

            <div>
              <p class="transaction-name">
                Amount Credited
              </p>

              <p class="transaction-time">
                ${currentTime}
              </p>
            </div>

          </div>

          <p class="transaction-amount credit-text">
            +${amount.toLocaleString()} PKR
          </p>

        `;

      }


      else {

        transaction.innerHTML = `

          <div class="transaction-left">

            <div class="transaction-icon debit-icon">
              -
            </div>

            <div>
              <p class="transaction-name">
                Amount Debited
              </p>

              <p class="transaction-time">
                ${currentTime}
              </p>
            </div>

          </div>

          <p class="transaction-amount debit-text">
            -${amount.toLocaleString()} PKR
          </p>

        `;

      }


      transactions.prepend(transaction);

    }


    creditButton.addEventListener("click", function () {

      let amount = Number(amountInput.value);


      if (amount <= 0) {

        message.textContent =
          "Please enter a valid amount.";

        message.style.color = "red";

        return;

      }


      balance = balance + amount;

      updateBalance();

      addTransaction("Credit", amount);

      lastAction.textContent = "Credit";

      message.textContent =
        "Amount credited successfully!";

      message.style.color = "green";

      amountInput.value = "";

    });


    debitButton.addEventListener("click", function () {

      let amount = Number(amountInput.value);


      if (amount <= 0) {

        message.textContent =
          "Please enter a valid amount.";

        message.style.color = "red";

        return;

      }


      if (amount > balance) {

        message.textContent =
          "Insufficient balance!";

        message.style.color = "red";

        return;

      }


      balance = balance - amount;

      updateBalance();

      addTransaction("Debit", amount);

      lastAction.textContent = "Debit";

      message.textContent =
        "Amount debited successfully!";

      message.style.color = "green";

      amountInput.value = "";

    });


    clearButton.addEventListener("click", function () {

      transactions.innerHTML = `
        <p id="empty-message">
          No transactions yet.
        </p>
      `;

      lastAction.textContent = "None";

      message.textContent =
        "Transaction history cleared.";

      message.style.color = "#64748b";

    });


    amountInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        creditButton.click();

      }

    });


    updateBalance();

  </script>

</body>
</html>
