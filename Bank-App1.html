<!DOCTYPE html>

<html>
<head>
  <title>Heera's Bank App</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

   body {
  background: linear-gradient(to bottom, #5e95ec , #2647a4);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

    #app {
      width: 400px;
      background: #ffffff;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    #app-title {
      color: #1e3a8a;
      margin-bottom: 8px;
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    #welcome {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
    }

    #balance-box {
      background: linear-gradient(135deg, #2647a4, #2647a4);
      color: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    #balance-label {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    #balance {
      font-size: 36px;
      font-weight: bold;
    }

    #currency {
      font-size: 16px;
      margin-left: 5px;
      opacity: 0.9;
    }

    #entry-box {
      text-align: left;
      margin-bottom: 20px;
    }

    #amount-label {
      display: block;
      margin-bottom: 8px;
      color: #1e293b;
      font-weight: bold;
      font-size: 14px;
    }

    #amount {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    #amount:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #button-box {
      display: flex;
      gap: 12px;
    }

    .action {
      width: 50%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .credit {
      background: #16a34a;
    }

    .debit {
      background: #dc2626;
    }

    .action:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .action:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
      min-height: 20px;
      font-size: 14px;
    }

    #note {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
      padding-top: 15px;
    }
    #app-title {
  color: #1e3a8a;
  margin-bottom: 8px;
  font-size: 32px;
  letter-spacing: 2px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.bank-icon {
  width: 38px;
  height: 38px;
  background: #1e3a8a;
  color: white;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 5px 12px rgba(30, 58, 138, 0.25);
}

  </style>

</head>

<body>

  <div id="app">


<h1 id="app-title">
  <span class="bank-icon">▣</span>
  NEXA BANK
</h1>

<p id="welcome">Secure • Simple • Smart Banking</p>

<div id="balance-box">
  <p id="balance-label">Available Balance</p>
  <p id="balance">1000 <span id="currency">PKR</span></p>
</div>

<div id="entry-box">
  <label id="amount-label" for="amount">Enter Amount</label>
  <input type="number" id="amount" placeholder="Enter amount">
</div>

<div id="button-box">
  <button class="action credit" id="credit-btn">Credit</button>
  <button class="action debit" id="debit-btn">Debit</button>
</div>

<p id="message"></p>

<p id="note">Your banking information is secure. Terms and conditions apply.</p>


  </div>

  <script>

    let balance = 1000;

    const balanceDisplay = document.getElementById("balance");
    const amountInput = document.getElementById("amount");
    const message = document.getElementById("message");

    const creditButton = document.getElementById("credit-btn");
    const debitButton = document.getElementById("debit-btn");


    creditButton.addEventListener("click", function () {

      let amount = Number(amountInput.value);

      if (amount <= 0) {
        message.textContent = "Please enter a valid amount.";
        message.style.color = "red";
        return;
      }

      balance = balance + amount;

      balanceDisplay.innerHTML =
        balance + ' <span id="currency">PKR</span>';

      message.textContent = "Amount credited successfully!";
      message.style.color = "green";

      amountInput.value = "";

    });


    debitButton.addEventListener("click", function () {

      let amount = Number(amountInput.value);

      if (amount <= 0) {
        message.textContent = "Please enter a valid amount.";
        message.style.color = "red";
        return;
      }

      if (amount > balance) {
        message.textContent = "Insufficient balance!";
        message.style.color = "red";
        return;
      }

      balance = balance - amount;

      balanceDisplay.innerHTML =
        balance + ' <span id="currency">PKR</span>';

      message.textContent = "Amount debited successfully!";
      message.style.color = "green";

      amountInput.value = "";

    });

  </script>

</body>
</html>
